services:
  - type: web
    name: bona-school-system
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bona-school-db
          property: connectionString

databases:
  - name: bona-school-db
    plan: free
    databaseName: bonaschooldb
    user: bonauser
