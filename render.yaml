services:
  - type: web
    name: bona-school-system
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bona-school-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://bona-school-system.onrender.com
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: bona-school-db
    plan: free
    databaseName: bonaschooldb
    user: bonauser
